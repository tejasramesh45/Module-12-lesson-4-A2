<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <style>
        body{
            background-color: aliceblue;
            font-family: cursive;
        }
        .jumbotron{
            background-color: rgb(230, 226, 222);
            border-left: 6px solid rgb(138, 138, 226);
        }
        .jumbotron h1{
            color: rgb(6, 51, 51);
        }
        .section title{
            color: rgb(25, 140, 140);
            margin-top: 30px;
            margin-bottom: 15px;
        }
        p{
            font-weight: bold;
            margin-bottom: 5px;
        }
      </style>
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>
                My Study Progress
            </h1>
            <p class="lead"> 
               Learn something new every day. Track your progress!
            </p>
            <button class="btn btn-primary">
            Math
            </button>
            <button class="btn btn-success">
            English
            </button>
             <button class="btn btn-warning">
            Hindi
            </button>
             <button class="btn btn-danger">
            Computer
            </button>
        </div>
    </div>
    <div class="container">
        <h2>
             Chapter completed
              <span class="badge badge-dander">4</span>
            </h2>
            <p>
                Math <span class="badge badge-primary">7 experiment</span>
            </p>
             <p>
                English <span class="badge badge-success">5 experiment</span>
            </p>
             <p>
                Hindi <span class="badge badge-warning">4 experiment</span>
            </p>
             <p>
                Computer <span class="badge badge-danger">3 experiment</span>
            </p>
            <div class="container">
                <h2 class="section-title">Research Progress</h2>
                <p>Math</p>
                <div class="progress mb-3">
                    <div class="progress-bar bg-primary" style="width: 85%;">
                        85%
                    </div>
                </div>
                <p>English</p>
                <div class="progress mb-3">
                    <div class="progress-bar bg-success" style="width: 70%;">
                        70%
                    </div>
                </div>
                <p>Hindi</p>
                <div class="progress mb-3">
                    <div class="progress-bar bg-warning" style="width: 55%;">
                        55%
                    </div>
                </div>
                <p>Computer</p>
                <div class="progress mb-3">
                    <div class="progress-bar bg-danger" style="width: 40%;">
                        40%
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
